		<title>Moorland</title>
		<style>
html, body {
	margin: 0; padding: 0; border: 0;
	width: 100%; height: 100%;
	overflow: hidden;
	position: fixed; inset: 0;
	background-color: #1b1718;
	color: #e8e0cc;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: none; text-size-adjust: none;
	font-family: Georgia, 'Times New Roman', serif;
}
#canvas { display: block; margin: 0; padding: 0; border: 0; touch-action: none; -webkit-touch-callout: none; }
#canvas:focus { outline: none; }
#safe-probe {
	position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#status {
	position: absolute; inset: 0;
	background: radial-gradient(ellipse at 70% 30%, #6f6a5a 0%, #3a4442 45%, #1b1718 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden; z-index: 5;
}
#status h1 { font-weight: normal; letter-spacing: 0.25em; font-size: min(12vw, 12vh, 84px); margin: 0 0 0.6em 0; color: #ddd6c2; text-shadow: 0 3px 12px #000; }
#status-bar { width: min(60vw, 520px); height: 10px; border-radius: 5px; background: rgba(0,0,0,0.45); overflow: hidden; border: 1px solid rgba(232,224,204,0.35); }
#status-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #b8862e, #ffc64d); transition: width 0.2s; }
#status-text { margin-top: 0.8em; font-size: 15px; color: #d8cfb8; opacity: 0.85; font-family: Arial, sans-serif; }
#status-notice {
	display: none; background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943;
	color: #e0e0e0; font-family: Arial, sans-serif; line-height: 1.3; margin: 1rem 2rem; padding: 1rem; text-align: center;
}
#rotate {
	display: none; position: fixed; inset: 0; z-index: 20;
	background: #1b1718; color: #e8e0cc;
	flex-direction: column; justify-content: center; align-items: center; text-align: center;
	font-size: 22px; line-height: 1.5; padding: 2em;
}
#rotate .phone {
	width: 46px; height: 80px; border: 4px solid #ffc64d; border-radius: 9px; margin-bottom: 1.2em;
	animation: turn 2.2s ease-in-out infinite;
}
#rotate small { opacity: 0.7; font-size: 16px; font-family: Arial, sans-serif; }
@keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
body.desktop #fs { left: auto; top: auto; right: 12px; bottom: 12px; }
#fs {
	display: none; position: fixed; z-index: 10;
	left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px);
	width: 44px; height: 44px; border-radius: 22px;
	background: rgba(36,32,32,0.45); border: 2px solid rgba(220,210,185,0.55);
	color: #e8e0cc; font-size: 22px; line-height: 40px; text-align: center; padding: 0;
	touch-action: manipulation;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<script>
/* Moorland mobile helpers (run before the engine starts). */
(function () {
	var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
	var mobile = coarse || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
	window.MOORLAND_MOBILE = mobile;
	/* Phones render at most at 2x pixel density: crisp enough, much lighter on the GPU. */
	if (mobile && window.devicePixelRatio > 2) {
		try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
	}
	/* iOS: audio only starts after a user gesture. Keep track of every AudioContext and resume them on taps. */
	var AC = window.AudioContext || window.webkitAudioContext;
	var ctxs = [];
	if (AC) {
		var Wrapped = function (opts) { var c = new AC(opts); ctxs.push(c); return c; };
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
	}
	var silentPlayed = false;
	function unlock() {
		ctxs.forEach(function (c) { if (c.state !== 'running' && c.resume) c.resume().catch(function () {}); });
		if (!silentPlayed) {
			silentPlayed = true;
			try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
			/* a silent HTML audio clip switches iOS to the "playback" session, so sound works with the mute switch on */
			try {
				var a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
				a.setAttribute('playsinline', ''); a.volume = 0.01; var p = a.play(); if (p && p.catch) p.catch(function () {});
			} catch (e) {}
		}
	}
	['touchend', 'pointerup', 'mousedown', 'keydown', 'click'].forEach(function (ev) { document.addEventListener(ev, unlock, true); });
	/* no page scroll, pinch zoom, double-tap zoom or long-press menu */
	function stop(e) { if (e.target && e.target.id === 'fs') return; e.preventDefault(); }
	document.addEventListener('touchmove', stop, { passive: false });
	document.addEventListener('gesturestart', stop, { passive: false });
	document.addEventListener('gesturechange', stop, { passive: false });
	document.addEventListener('dblclick', stop, { passive: false });
	document.addEventListener('contextmenu', stop, { passive: false });
	var lastEnd = 0;
	document.addEventListener('touchend', function (e) { var n = Date.now(); if (n - lastEnd < 300 && e.target && e.target.id !== 'canvas' && e.target.id !== 'fs') e.preventDefault(); lastEnd = n; }, { passive: false });
	document.addEventListener('visibilitychange', function () { if (!document.hidden) unlock(); });
})();
		</script>
	</head>
	<body>
		<div id="safe-probe"></div>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<button id="fs" aria-label="Tam ekran">&#x26F6;</button>
		<div id="rotate"><div class="phone"></div>Cihazı yatay çevir<br><small>Rotate your device</small></div>
		<div id="status">
			<h1>MOORLAND</h1>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-text">Yükleniyor…</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4247984,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	/* Fullscreen button: only where the browser supports it (not on iPhone Safari). */
	const fs = document.getElementById('fs');
	if (!window.MOORLAND_MOBILE) document.body.classList.add('desktop');
	const root = document.documentElement;
	const canFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(root.requestFullscreen || root.webkitRequestFullscreen);
	function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
	function syncFs() { fs.style.display = (canFs && !isFs() && gameStarted) ? 'block' : 'none'; }
	let gameStarted = false;
	fs.addEventListener('click', function (e) {
		e.preventDefault(); e.stopPropagation();
		const req = root.requestFullscreen || root.webkitRequestFullscreen;
		try {
			const p = req.call(root);
			const lock = function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); };
			if (p && p.then) p.then(lock).catch(function () {}); else lock();
		} catch (err) {}
		document.getElementById('canvas').focus();
	});
	document.addEventListener('fullscreenchange', syncFs);
	document.addEventListener('webkitfullscreenchange', syncFs);

	const statusOverlay = document.getElementById('status');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusBar = document.getElementById('status-bar');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	function showStatus() { statusOverlay.style.visibility = 'visible'; }
	function hideStatus() { statusOverlay.remove(); initializing = false; gameStarted = true; syncFs(); }

	function displayFailureNotice(err) {
		console.error(err);
		let msg = 'An unknown error occured';
		if (err instanceof Error) msg = err.message; else if (typeof err === 'string') msg = err;
		statusNotice.textContent = '';
		msg.split('\n').forEach(function (line) { statusNotice.appendChild(document.createTextNode(line)); statusNotice.appendChild(document.createElement('br')); });
		statusNotice.style.display = 'block';
		statusBar.style.display = 'none';
		statusText.textContent = 'Oyun açılamadı. Sayfayı yenilemeyi dene.';
		showStatus();
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		return;
	}
	showStatus();
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round(current / total * 100));
				statusFill.style.width = pct + '%';
				statusText.textContent = 'Yükleniyor… %' + pct + '  (' + (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB)';
				if (pct >= 100) statusText.textContent = 'Başlatılıyor…';
			} else {
				statusText.textContent = 'Yükleniyor…';
			}
		},
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
	</body>
</html>
